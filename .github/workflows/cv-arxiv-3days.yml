# This is a basic workflow to help you get started with Actions

name: Run Arxiv Papers Per-3-Days

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'daily_arxiv.py'
      - 'rss_source.py'
      - 'test_regressions.py'
      - 'config.yaml'
      - 'docs/assets/date-index.js'
      - '.github/workflows/cv-arxiv-3days.yml'
      - '.github/workflows/update_paper_links.yml'
  schedule:
    - cron:  "0 0 */3 * *"  # daily: "0 0/12 * * *"  #'*/60 * * * *'
  # Triggers the workflow on push or pull request events but only for the main branch
#   push:
#     branches:
#     - main

env:

  GITHUB_USER_NAME: Jinlu Zhang
  GITHUB_USER_EMAIL: jinluzhang1126@outlook.com
  
  
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
concurrency:
  group: arxiv-index-main
  cancel-in-progress: false

jobs:
  # This workflow contains a single job called "build"
  build:
    name: update
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
        
      - name: Set up Python Env
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          #architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install arxiv
          pip install requests
          pip install pyyaml
          
      - name: Run daily arxiv 
        run: |
          python -m unittest -v test_regressions.py
          python daily_arxiv.py
          
      - name: Commit generated papers safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/cv-arxiv-daily.json docs/cv-arxiv-daily-web.json docs/index.md docs/cv-arxiv-daily-wechat.json docs/wechat.md docs/collection-status.json
          if git diff --cached --quiet; then
            echo "No generated-file changes."
            exit 0
          fi
          git commit -m "Refresh arXiv paper index"
          git push origin HEAD:main
